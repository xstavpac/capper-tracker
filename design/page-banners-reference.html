<!doctype html>
<!--
  BettingView page banners: DESIGN REFERENCE (not production code).
  One shared banner shell (rounded glowing card on navy, grid, faint edge bars,
  light streak, round icon badge, divider, title, optional motto, controls row)
  plus per-page right-side SVG art and CSS animations.
  Loop forever: parlay, live.  Play once on load: dashboard, cappers, picks.
  Rebuild this as a React component; copy colors, sizes, SVG paths and keyframes exactly.
-->

body{margin:0}

.bv-trace{stroke-dasharray:70 710;animation:bvTrace 2.4s linear infinite}
.bv-dot{transform-box:fill-box;transform-origin:center;animation:bvBeat 1.2s ease-in-out infinite}
.bv-wave1{animation:bvWave 1.2s ease-in-out infinite}
.bv-wave2{animation:bvWave 1.2s ease-in-out .25s infinite}
@media (prefers-reduced-motion: reduce){.bv-trace,.bv-dot,.bv-wave1,.bv-wave2{animation:none}.bv-trace{stroke-dasharray:none;opacity:0}}

@keyframes bvBoltFill{0%,62%,100%{fill:#FACC15}70%,76%{fill:#FEF9C3}}
.bv-chain{stroke-dasharray:60 660;animation:bvChain 3s linear infinite}

.bv-leg1{animation-delay:.15s}.bv-leg2{animation-delay:.9s}.bv-leg3{animation-delay:1.55s}
.bv-bolt{transform-box:fill-box;transform-origin:center;animation:bvBolt 3s ease-in-out infinite}
.bv-boltfill{animation:bvBoltFill 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bv-chain,.bv-leg,.bv-bolt,.bv-boltfill{animation:none}.bv-chain{opacity:0}}
@keyframes bvPing{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes bvCrown{0%,100%{transform:translateY(0);fill:#FACC15}50%{transform:translateY(-3px);fill:#FEF08A}}
@keyframes bvRing{0%,100%{stroke:#BFDBFE;stroke-width:2.5}50%{stroke:#FFFFFF;stroke-width:4}}
@keyframes bvDrift{to{stroke-dashoffset:-32}}
@keyframes bvPending{0%,100%{stroke:#60A5FA;opacity:.6}50%{stroke:#BFDBFE;opacity:1}}
@keyframes bvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bvDrawOnce{from{stroke-dashoffset:170}to{stroke-dashoffset:0}}
.bv-draw{stroke-dasharray:170;animation:bvDrawOnce 1.4s ease-out .5s both}
@keyframes bvGrowOnce{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.bv-bar{transform-box:fill-box;transform-origin:bottom;animation:bvGrowOnce .9s ease-out both}
@keyframes bvDonutOnce{from{stroke-dasharray:0 176}to{stroke-dasharray:110 66}}
.bv-donut{animation:bvDonutOnce 1.4s ease-out .4s both}
.bv-ping{animation:bvPing 1.6s ease-in-out 1.8s 1}
.bv-crown{transform-box:fill-box;transform-origin:center;animation:bvCrown 2.4s ease-in-out 1}
.bv-ring{animation:bvRing 2.4s ease-in-out 1}
